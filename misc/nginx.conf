server {
    # ...existing config

    # Careers Project Homepage
    location /careers {
        proxy_pass http://localhost:3005; # Replace with the port your careers project uses
        include /etc/nginx/proxy_params;
        try_files $uri $uri/ /index.html;
    }

    # Careers Admin Panel
    location /careers/admin {
        proxy_pass http://localhost:3006; # Replace with the port your careers admin panel uses
        include /etc/nginx/proxy_params;
        try_files $uri $uri/ /index.html;
    }
}